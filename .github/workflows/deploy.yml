name: Homelab CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert GitHub repository name to lowercase
        id: string
        run: |
          echo "repo_lowercase=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            POCKETBASE_URL=${{ secrets.POCKETBASE_URL }}
          tags: |
            ${{ steps.string.outputs.repo_lowercase }}:latest
            ${{ steps.string.outputs.repo_lowercase }}:${{ github.sha }}

      - name: Trigger Portainer Webhook
        run: curl -fSsl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
